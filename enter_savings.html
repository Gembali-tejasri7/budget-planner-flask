<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Savings for {{ month }}</title>
    <style>
        /* Add your styling here */
        body { font-family: sans-serif; background: linear-gradient(135deg, #75ff04, #c407f4df); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: rgba(255, 255, 255, 0.8); padding: 40px; border-radius: 10px; box-shadow: 0 0 20px rgba(0, 0, 0, 0.1); text-align: center; width: 400px; }
        h1 { color: #e65100; margin-bottom: 30px; }
        label { display: block; margin-bottom: 10px; color: #555; font-weight: bold; }
        input[type="number"],
        input[type="text"] { width: calc(100% - 22px); padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .button { display: inline-block; padding: 10px 20px; text-decoration: none; background-color: #ff7043; color: white; border-radius: 5px; margin-top: 20px; transition: background-color 0.3s ease; }
        .button:hover { background-color: #e64a19; }
        .back-logout { position: absolute; top: 20px; left: 20px; }
        .back-logout a { padding: 8px 15px; text-decoration: none; background-color: #fafcfd; color: rgb(17, 13, 13); border-radius: 5px; transition: background-color 0.3s ease; }
        .back-logout a:hover { background-color: #1e88e5; }
        .logout-button { position: absolute; top: 20px; right: 20px; }
        .logout-button a { padding: 8px 15px; text-decoration: none; background-color: #f6f4f4; color: rgb(43, 40, 40); border-radius: 5px; transition: background-color 0.3s ease; }
        .logout-button a:hover { background-color: #b71c1c; }
        .button-container { text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="back-logout">
            <a href="{{ url_for('enter_expenses', month_index=month_index) }}">Back</a>
        </div>
        <div class="logout-button">
            <a href="{{ url_for('logout') }}">Log Out</a>
        </div>
        <h1>Enter Savings for {{ month }}</h1>
        <form method="POST">
            <label for="savings_amount">Savings for {{ month }}:</label>
            <input type="number" id="savings_amount" name="savings_amount" required><br><br>

            <label for="item_to_purchase">Item to Purchase (Optional):</label>
            <input type="text" id="item_to_purchase" name="item_to_purchase"><br><br>

            <label for="item_price">Total Price of Item (Optional):</label>
            <input type="number" id="item_price" name="item_price"><br><br>

            <div class="button-container">
                <button type="submit">Next</button>
            </div>
        </form>
    </div>
</body>
</html>
