<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Income for {{ month }}</title>
    <style>
        /* Add your styling here */
        body { font-family: sans-serif; background: linear-gradient(135deg, #db273f, #b558d4); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: rgba(255, 255, 255, 0.8); padding: 40px; border-radius: 10px; box-shadow: 0 0 20px rgba(0, 0, 0, 0.1); text-align: center; }
        h1 { color: #00bcd4; margin-bottom: 20px; }
        label { display: block; margin-bottom: 10px; font-weight: bold; }
        input[type="number"] { padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 20px; width: 200px; }
        button { padding: 10px 20px; background-color: #00bcd4; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; transition: background-color 0.3s ease; }
        button:hover { background-color: #008ba7; }
        .back-logout { position: absolute; top: 20px; left: 20px; }
        .logout-button { position: absolute; top: 20px; right: 20px; }
        .back-logout a, .logout-button a { color: #333; text-decoration: none; padding: 8px 15px; border: 1px solid #ccc; border-radius: 5px; background-color: #f0f0f0; margin: 5px; }
        .back-logout a:hover, .logout-button a:hover { background-color: #e0e0e0; }
        .button-container { text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="back-logout"><a href="{{ url_for('dashboard') }}">Back</a></div>
        <div class="logout-button"><a href="{{ url_for('logout') }}">Log Out</a></div>
        <h1>Enter Income for {{ month }}</h1>
        <form method="POST">
            <label for="income">Income for {{ month }}:</label>
            <input type="number" id="income" name="income" required><br><br>
            <div class="button-container">
                <button type="submit">Next</button>
            </div>
        </form>
    </div>
</body>
</html>
