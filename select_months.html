
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Number of Months</title>
    <style>
        /* Your styling here */
        body { font-family: sans-serif; background: linear-gradient(135deg, #35d853, #9767d1); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: rgba(255, 255, 255, 0.8); padding: 40px; border-radius: 10px; box-shadow: 0 0 20px rgba(0, 0, 0, 0.1); text-align: center; }
        h1 { color: #e91e63; margin-bottom: 20px; }
        label { display: block; margin-bottom: 10px; font-weight: bold; }
        input[type="number"] { padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 20px; width: 150px; }
        button { padding: 10px 20px; background-color: #e91e63; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; transition: background-color 0.3s ease; }
        button:hover { background-color: #c2185b; }
        .back-logout { position: absolute; top: 20px; left: 20px; }
        .logout-button { position: absolute; top: 20px; right: 20px; }
        .back-logout a, .logout-button a { color: #333; text-decoration: none; padding: 8px 15px; border: 1px solid #ccc; border-radius: 5px; background-color: #f0f0f0; margin: 5px; }
        .back-logout a:hover, .logout-button a:hover { background-color: #e0e0e0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="back-logout"><a href="{{ url_for('dashboard') }}">Back</a></div>
        <div class="logout-button"><a href="{{ url_for('logout') }}">Log Out</a></div>
        <h1>Welcome to Budget Planning Application</h1>
        <p>How many months of data do you want to store?</p>
        <form method="POST" action="{{ url_for('set_months') }}">
            <label for="num_months">Number of Months (up to 12):</label>
            <input type="number" id="num_months" name="num_months" min="1" max="12" value="12" required><br><br>
            <button type="submit">Next</button>
        </form>
    </div>
</body>
</html>
