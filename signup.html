<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        body { font-family: sans-serif; background: linear-gradient(135deg,#3276af, #c8e46c); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: rgba(255, 255, 255, 0.8); padding: 40px; border-radius: 10px; box-shadow: 0 0 20px rgba(0, 0, 0, 0.1); text-align: center; width: 300px; }
        h1 { color: #7cb342; margin-bottom: 30px; }
        label { display: block; margin-bottom: 5px; color: #555; }
        input[type="text"], input[type="password"] { width: calc(100% - 22px); padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .button { display: inline-block; padding: 10px 20px; text-decoration: none; background-color: #8bc34a; color: white; border-radius: 5px; margin-top: 20px; transition: background-color 0.3s ease; }
        .button:hover { background-color: #689f38; }
        p.error { color: red; margin-bottom: 10px; }
        a { color: #555; text-decoration: none; margin-top: 15px; display: block; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sign Up</h1>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
        <form action="{{ url_for('signup') }}" method="post">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br>
            <input type="submit" value="Sign Up" class="button">
        </form>
        <a href="{{ url_for('index') }}">Back</a>
    </div>
</body>
</html>
